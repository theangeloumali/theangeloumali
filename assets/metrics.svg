<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 170" width="840" height="170" role="img" aria-labelledby="t d">
  <title id="t">By the numbers</title>
  <desc id="d">300+ white-label storefronts, 1,000+ businesses served, 300K monthly end users, 15+ production systems.</desc>
  <defs>
    <linearGradient id="sheen" x1="0" x2="1">
      <stop offset="0" stop-color="#d5b13a" stop-opacity="0" />
      <stop offset="0.5" stop-color="#d5b13a" stop-opacity="1" />
      <stop offset="1" stop-color="#d5b13a" stop-opacity="0" />
    </linearGradient>
    <clipPath id="c1"><rect x="0" y="0" width="198" height="170" rx="14" /></clipPath>
    <clipPath id="c2"><rect x="214" y="0" width="198" height="170" rx="14" /></clipPath>
    <clipPath id="c3"><rect x="428" y="0" width="198" height="170" rx="14" /></clipPath>
    <clipPath id="c4"><rect x="642" y="0" width="198" height="170" rx="14" /></clipPath>
  </defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .num { font-size: 50px; font-weight: 700; letter-spacing: -1px; fill: #d5b13a; }
    .lab { font-size: 21px; fill: #ece7de; }
    .card { opacity: 0; animation: rise 0.8s cubic-bezier(0.2, 0.7, 0.2, 1) forwards; }
    .k2 { animation-delay: 0.12s; }
    .k3 { animation-delay: 0.24s; }
    .k4 { animation-delay: 0.36s; }
    .sweep { animation: sweep 5s ease-in-out infinite; }
    .s2 { animation-delay: 0.6s; }
    .s3 { animation-delay: 1.2s; }
    .s4 { animation-delay: 1.8s; }
    @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes sweep { 0% { transform: translateX(-120px); } 45%, 100% { transform: translateX(220px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .card { opacity: 1; } }
  </style>

  <g class="card">
    <rect x="0.75" y="0.75" width="196.5" height="168.5" rx="13.25" fill="#0c1117" stroke="#8ea9c4" stroke-opacity="0.25" stroke-width="1.5" />
    <text class="sans num" x="22" y="78">300+</text>
    <text class="sans lab" x="22" y="112">White-label</text>
    <text class="sans lab" x="22" y="136">storefronts</text>
    <g clip-path="url(#c1)"><rect class="sweep" x="0" y="166" width="120" height="4" fill="url(#sheen)" /></g>
  </g>
  <g class="card k2">
    <rect x="214.75" y="0.75" width="196.5" height="168.5" rx="13.25" fill="#0c1117" stroke="#8ea9c4" stroke-opacity="0.25" stroke-width="1.5" />
    <text class="sans num" x="236" y="78">1,000+</text>
    <text class="sans lab" x="236" y="112">Businesses</text>
    <text class="sans lab" x="236" y="136">served</text>
    <g clip-path="url(#c2)"><rect class="sweep s2" x="214" y="166" width="120" height="4" fill="url(#sheen)" /></g>
  </g>
  <g class="card k3">
    <rect x="428.75" y="0.75" width="196.5" height="168.5" rx="13.25" fill="#0c1117" stroke="#8ea9c4" stroke-opacity="0.25" stroke-width="1.5" />
    <text class="sans num" x="450" y="78">300K</text>
    <text class="sans lab" x="450" y="112">Monthly</text>
    <text class="sans lab" x="450" y="136">end users</text>
    <g clip-path="url(#c3)"><rect class="sweep s3" x="428" y="166" width="120" height="4" fill="url(#sheen)" /></g>
  </g>
  <g class="card k4">
    <rect x="642.75" y="0.75" width="196.5" height="168.5" rx="13.25" fill="#0c1117" stroke="#8ea9c4" stroke-opacity="0.25" stroke-width="1.5" />
    <text class="sans num" x="664" y="78">15+</text>
    <text class="sans lab" x="664" y="112">Production</text>
    <text class="sans lab" x="664" y="136">systems</text>
    <g clip-path="url(#c4)"><rect class="sweep s4" x="642" y="166" width="120" height="4" fill="url(#sheen)" /></g>
  </g>
</svg>
