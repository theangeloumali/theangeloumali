<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 250" width="840" height="250" role="img" aria-labelledby="t d">
  <title id="t">Career timeline, 2017 to now</title>
  <desc id="d">Full-time roles: Trends and Technologies 2017 to 2020, Adaca 2020 to 2022, Blackpepper 2022 to 2024. ZKidz Dev LLC: Lead Software Engineer from 2020, Lead Software Engineer and AI Engineer from 2025 to now.</desc>
  <defs><clipPath id="card"><rect width="840" height="250" rx="16" /></clipPath></defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .lbl { font-size: 17px; }
    .lane { font-size: 15px; letter-spacing: 1.8px; fill: #8ea9c4; }
    .bar rect { transform-box: fill-box; transform-origin: left center; animation: grow 14s cubic-bezier(0.2, 0.7, 0.2, 1) infinite both; animation-delay: inherit; }
    .bar text { animation: label 14s ease-out infinite both; animation-delay: inherit; }
    .b0 { animation-delay: 0.00s; }
    .b1 { animation-delay: 0.25s; }
    .b2 { animation-delay: 0.50s; }
    .b3 { animation-delay: 0.75s; }
    .b4 { animation-delay: 1.00s; }
    .ping { transform-box: fill-box; transform-origin: center; animation: ping 2s ease-out infinite; }
    @keyframes grow { 0% { transform: scaleX(0); opacity: 0; } 7%, 94% { transform: scaleX(1); opacity: 1; } 100% { transform: scaleX(1); opacity: 0; } }
    @keyframes label { 0%, 5% { opacity: 0; } 10%, 94% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes ping { 0% { transform: scale(1); opacity: 0.8; } 100% { transform: scale(3); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <g clip-path="url(#card)">
