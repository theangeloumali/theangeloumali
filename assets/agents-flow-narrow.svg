<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 580" width="420" height="580" role="img" aria-labelledby="t d">
  <title id="t">How a task moves through my agent framework</title>
  <desc id="d">A task is triaged by size and risk, routed to one of 13 specialized agents such as frontend, backend, QA, security and DevOps, then has to pass the quality gates: format, lint, typecheck, tests, build and a runtime smoke test.</desc>
  <defs><clipPath id="card"><rect width="420" height="580" rx="16" /></clipPath></defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .check { transform-box: fill-box; transform-origin: center; animation: pop 5s ease-in-out infinite; }
    @keyframes pop { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.14); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .dot { display: none; } }
  </style>
  <g clip-path="url(#card)">
    <rect width="420" height="580" fill="#0c1117" />
    <g fill="none" stroke="#8ea9c4" stroke-opacity="0.3" stroke-width="1.5">
      <path id="p0" d="M210 78 L210 150 C210 190 112 180 112 216 L112 256 C112 306 210 380 210 418 L210 520" />
      <path id="p1" d="M210 78 L210 150 C210 190 308 180 308 216 L308 256 C308 306 210 380 210 418 L210 520" />
      <path id="p2" d="M210 78 L210 150 C210 190 112 180 112 270 L112 310 C112 360 210 380 210 418 L210 520" />
      <path id="p3" d="M210 78 L210 150 C210 190 308 180 308 270 L308 310 C308 360 210 380 210 418 L210 520" />
      <path id="p4" d="M210 78 L210 150 C210 190 112 180 112 324 L112 364 C112 414 210 380 210 418 L210 520" />
    </g>
    <circle class="dot" r="5" fill="#d5b13a"><animateMotion dur="5s" begin="0s" repeatCount="indefinite"><mpath href="#p0" /></animateMotion></circle>
    <circle class="dot" r="5" fill="#d5b13a"><animateMotion dur="5s" begin="1s" repeatCount="indefinite"><mpath href="#p1" /></animateMotion></circle>
    <circle class="dot" r="5" fill="#d5b13a"><animateMotion dur="5s" begin="2s" repeatCount="indefinite"><mpath href="#p2" /></animateMotion></circle>
    <circle class="dot" r="5" fill="#d5b13a"><animateMotion dur="5s" begin="3s" repeatCount="indefinite"><mpath href="#p3" /></animateMotion></circle>
    <circle class="dot" r="5" fill="#d5b13a"><animateMotion dur="5s" begin="4s" repeatCount="indefinite"><mpath href="#p4" /></animateMotion></circle>
    <rect x="140" y="24" width="140" height="54" rx="12" fill="#121a24" stroke="#8ea9c4" stroke-opacity="0.5" stroke-width="1.5" />
    <text class="sans" x="210" y="58" font-size="21" font-weight="600" text-anchor="middle" fill="#ece7de">Task</text>
    <rect x="120" y="110" width="180" height="70" rx="12" fill="#121a24" stroke="#8ea9c4" stroke-opacity="0.5" stroke-width="1.5" />
    <text class="sans" x="210" y="142" font-size="21" font-weight="600" text-anchor="middle" fill="#ece7de">Triage</text>
    <text class="mono" x="210" y="165" font-size="15" text-anchor="middle" fill="#8ea9c4">size + risk</text>
    <rect x="30" y="216" width="164" height="40" rx="20" fill="#121a24" stroke="#d5b13a" stroke-opacity="0.4" stroke-width="1.5" /><text class="sans" x="112" y="243" font-size="19" text-anchor="middle" fill="#ece7de">Frontend</text>
    <rect x="226" y="216" width="164" height="40" rx="20" fill="#121a24" stroke="#d5b13a" stroke-opacity="0.4" stroke-width="1.5" /><text class="sans" x="308" y="243" font-size="19" text-anchor="middle" fill="#ece7de">Backend</text>
    <rect x="30" y="270" width="164" height="40" rx="20" fill="#121a24" stroke="#d5b13a" stroke-opacity="0.4" stroke-width="1.5" /><text class="sans" x="112" y="297" font-size="19" text-anchor="middle" fill="#ece7de">QA</text>
    <rect x="226" y="270" width="164" height="40" rx="20" fill="#121a24" stroke="#d5b13a" stroke-opacity="0.4" stroke-width="1.5" /><text class="sans" x="308" y="297" font-size="19" text-anchor="middle" fill="#ece7de">Security</text>
    <rect x="30" y="324" width="164" height="40" rx="20" fill="#121a24" stroke="#d5b13a" stroke-opacity="0.4" stroke-width="1.5" /><text class="sans" x="112" y="351" font-size="19" text-anchor="middle" fill="#ece7de">DevOps</text>
    <text class="mono" x="308" y="350" font-size="16" text-anchor="middle" fill="#8ea9c4">+ 8 more agents</text>
    <rect x="80" y="400" width="260" height="110" rx="12" fill="#121a24" stroke="#d5b13a" stroke-opacity="0.5" stroke-width="1.5" />
    <text class="sans" x="210" y="432" font-size="21" font-weight="600" text-anchor="middle" fill="#ece7de">Quality gates</text>
    <text class="mono" x="210" y="460" font-size="15" text-anchor="middle" fill="#8ea9c4">format · lint · typecheck</text>
    <text class="mono" x="210" y="484" font-size="15" text-anchor="middle" fill="#8ea9c4">tests · build · smoke</text>
    <g class="check"><circle cx="210" cy="544" r="18" fill="#d5b13a" /><path d="M201 545 l6 6 l11 -12.5" fill="none" stroke="#0c1117" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g>
  </g>
  <rect x="0.75" y="0.75" width="418.5" height="578.5" rx="15.25" fill="none" stroke="#8ea9c4" stroke-opacity="0.25" stroke-width="1.5" />
</svg>
