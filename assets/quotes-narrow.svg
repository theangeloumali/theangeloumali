    <g class="q" style="animation-delay: 0s"><text class="sans" x="32" y="118" font-size="23" fill="#ece7de">The biggest benefit to hiring</text><text class="sans" x="32" y="150" font-size="23" fill="#ece7de">Angelo is he can solve any</text><text class="sans" x="32" y="182" font-size="23" fill="#ece7de">problem that comes up.</text><text class="sans" x="32" y="232" font-size="19" font-weight="700" fill="#d5b13a">David</text><text class="sans" x="32" y="258" font-size="17" fill="#8ea9c4">Founder at FTBLRLife</text></g>
    <g class="q" style="animation-delay: 6s"><text class="sans" x="32" y="118" font-size="23" fill="#ece7de">Christian played a crucial role</text><text class="sans" x="32" y="150" font-size="23" fill="#ece7de">in our success, deploying over</text><text class="sans" x="32" y="182" font-size="23" fill="#ece7de">300 white-label storefronts.</text><text class="sans" x="32" y="232" font-size="19" font-weight="700" fill="#d5b13a">Hussam</text><text class="sans" x="32" y="258" font-size="17" fill="#8ea9c4">Lead Engineer</text></g>
    <g class="q" style="animation-delay: 12s"><text class="sans" x="32" y="118" font-size="23" fill="#ece7de">Angelo brings both technical</text><text class="sans" x="32" y="150" font-size="23" fill="#ece7de">expertise and business</text><text class="sans" x="32" y="182" font-size="23" fill="#ece7de">judgment to every project.</text><text class="sans" x="32" y="232" font-size="19" font-weight="700" fill="#d5b13a">Louis</text><text class="sans" x="32" y="258" font-size="17" fill="#8ea9c4">Head of Product</text></g>

  </g>
