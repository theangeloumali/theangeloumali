<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 290" width="420" height="290" role="img" aria-labelledby="t d">
  <title id="t">What clients and colleagues say</title>
  <desc id="d">David, Founder at FTBLRLife: The biggest benefit to hiring Angelo is he can solve any problem that comes up. Hussam, Lead Engineer: Christian played a crucial role in our success, deploying over 300 white-label storefronts. Louis, Head of Product: Angelo brings both technical expertise and business judgment to every project.</desc>
  <defs><clipPath id="card"><rect width="420" height="290" rx="16" /></clipPath></defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .q { opacity: 0; animation: quote 18s ease-in-out infinite; }
    @keyframes quote { 0% { opacity: 0; transform: translateY(10px); } 3%, 30% { opacity: 1; transform: translateY(0); } 33.3%, 100% { opacity: 0; transform: translateY(-10px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .q:first-of-type { opacity: 1; } }
  </style>
