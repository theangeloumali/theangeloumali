<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 34" width="840" height="34" role="presentation">
  <defs>
    <linearGradient id="base" x1="0" x2="1">
      <stop offset="0" stop-color="#8ea9c4" stop-opacity="0.55" />
      <stop offset="1" stop-color="#8ea9c4" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="spark" x1="0" x2="1">
      <stop offset="0" stop-color="#d5b13a" stop-opacity="0" />
      <stop offset="0.5" stop-color="#d5b13a" stop-opacity="1" />
      <stop offset="1" stop-color="#d5b13a" stop-opacity="0" />
    </linearGradient>
    <clipPath id="track"><rect x="62" y="0" width="778" height="34" /></clipPath>
  </defs>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .spark { animation: run 7s ease-in-out infinite; animation-delay: 0.0s; }
    @keyframes run { 0% { transform: translateX(-90px); } 70%, 100% { transform: translateX(860px); } }
    @media (prefers-reduced-motion: reduce) { .spark { animation: none; transform: translateX(120px); } }
  </style>
  <rect x="0" y="5" width="46" height="24" rx="6" fill="#d5b13a" />
  <text class="mono" x="23" y="23" font-size="15" font-weight="700" text-anchor="middle" fill="#0c1117">08</text>
  <rect x="62" y="16" width="778" height="2" fill="url(#base)" />
  <g clip-path="url(#track)"><rect class="spark" x="0" y="15.5" width="140" height="3" rx="1.5" fill="url(#spark)" /></g>
</svg>
