<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 200" width="840" height="200" role="img" aria-labelledby="t d">
  <title id="t">What clients and colleagues say</title>
  <desc id="d">David, Founder at FTBLRLife: The biggest benefit to hiring Angelo is he can solve any problem that comes up. Hussam, Lead Engineer: Christian played a crucial role in our success, deploying over 300 white-label storefronts. Louis, Head of Product: Angelo brings both technical expertise and business judgment to every project.</desc>
  <defs><clipPath id="card"><rect width="840" height="200" rx="16" /></clipPath></defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .q { opacity: 0; animation: quote 18s ease-in-out infinite; }
    .pip { animation: pip 18s linear infinite; }
    @keyframes quote { 0% { opacity: 0; transform: translateY(10px); } 3%, 30% { opacity: 1; transform: translateY(0); } 33.3%, 100% { opacity: 0; transform: translateY(-10px); } }
    @keyframes pip { 0%, 33.3% { fill: #d5b13a; } 33.4%, 100% { fill: #8ea9c4; fill-opacity: 0.4; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .q:first-of-type { opacity: 1; } }
  </style>
  <g clip-path="url(#card)">
    <rect width="840" height="200" fill="#0c1117" />
    <text class="sans" x="40" y="118" font-size="120" font-weight="700" fill="#d5b13a" fill-opacity="0.9">“</text>
    <g class="q" style="animation-delay: 0s">
      <text class="sans" x="108" y="78" font-size="26" fill="#ece7de">The biggest benefit to hiring Angelo is he can</text>
      <text class="sans" x="108" y="114" font-size="26" fill="#ece7de">solve any problem that comes up.</text>
      <text class="sans" x="108" y="160" font-size="19" font-weight="700" fill="#d5b13a">David<tspan font-weight="400" fill="#8ea9c4">  ·  Founder at FTBLRLife</tspan></text>
    </g>
    <g class="q" style="animation-delay: 6s">
      <text class="sans" x="108" y="78" font-size="26" fill="#ece7de">Christian played a crucial role in our success,</text>
      <text class="sans" x="108" y="114" font-size="26" fill="#ece7de">deploying over 300 white-label storefronts.</text>
      <text class="sans" x="108" y="160" font-size="19" font-weight="700" fill="#d5b13a">Hussam<tspan font-weight="400" fill="#8ea9c4">  ·  Lead Engineer</tspan></text>
    </g>
    <g class="q" style="animation-delay: 12s">
      <text class="sans" x="108" y="78" font-size="26" fill="#ece7de">Angelo brings both technical expertise and</text>
      <text class="sans" x="108" y="114" font-size="26" fill="#ece7de">business judgment to every project.</text>
      <text class="sans" x="108" y="160" font-size="19" font-weight="700" fill="#d5b13a">Louis<tspan font-weight="400" fill="#8ea9c4">  ·  Head of Product</tspan></text>
    </g>
    <circle class="pip" style="animation-delay: 0s" cx="764" cy="156" r="4" fill="#8ea9c4" /><circle class="pip" style="animation-delay: 6s" cx="782" cy="156" r="4" fill="#8ea9c4" /><circle class="pip" style="animation-delay: 12s" cx="800" cy="156" r="4" fill="#8ea9c4" />
  </g>
  <rect x="0.75" y="0.75" width="838.5" height="198.5" rx="15.25" fill="none" stroke="#8ea9c4" stroke-opacity="0.25" stroke-width="1.5" />
</svg>
