<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 330" width="840" height="330" role="img" aria-labelledby="t d">
  <title id="t">How a task moves through my agent framework</title>
  <desc id="d">A task is triaged by size and risk, routed to one of 13 specialized agents such as frontend, backend, QA, security and DevOps, then has to pass the quality gates: format, lint, typecheck, tests, build and a runtime smoke test.</desc>
  <defs><clipPath id="card"><rect width="840" height="330" rx="16" /></clipPath></defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .chip rect { animation: glow 5s linear infinite; animation-delay: inherit; }
    .gate { animation: gate 5s linear infinite; }
    .check { transform-box: fill-box; transform-origin: center; animation: pop 5s ease-in-out infinite; }
    @keyframes glow { 0%, 38%, 64%, 100% { stroke-opacity: 0.3; } 50% { stroke-opacity: 1; } }
    @keyframes gate { 0%, 100% { stroke-opacity: 0.35; } 50% { stroke-opacity: 0.9; } }
    @keyframes pop { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.14); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .dot { display: none; } }
  </style>
  <g clip-path="url(#card)">
    <rect width="840" height="330" fill="#0c1117" />
    <g fill="none" stroke="#8ea9c4" stroke-opacity="0.3" stroke-width="1.5">
    <path id="p0" d="M150 161 L324 161 C358 161 354 49 388 49 L538 49 C572 49 568 161 602 161 L806 161" />
    <path id="p1" d="M150 161 L324 161 C358 161 354 105 388 105 L538 105 C572 105 568 161 602 161 L806 161" />
    <path id="p2" d="M150 161 L324 161 C358 161 354 161 388 161 L538 161 C572 161 568 161 602 161 L806 161" />
    <path id="p3" d="M150 161 L324 161 C358 161 354 217 388 217 L538 217 C572 217 568 161 602 161 L806 161" />
    <path id="p4" d="M150 161 L324 161 C358 161 354 273 388 273 L538 273 C572 273 568 161 602 161 L806 161" />
    </g>
    <circle class="dot" r="5" fill="#d5b13a"><animateMotion dur="5s" begin="0s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear"><mpath href="#p0" /></animateMotion></circle>
    <circle class="dot" r="5" fill="#d5b13a"><animateMotion dur="5s" begin="1s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear"><mpath href="#p1" /></animateMotion></circle>
    <circle class="dot" r="5" fill="#d5b13a"><animateMotion dur="5s" begin="2s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear"><mpath href="#p2" /></animateMotion></circle>
    <circle class="dot" r="5" fill="#d5b13a"><animateMotion dur="5s" begin="3s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear"><mpath href="#p3" /></animateMotion></circle>
    <circle class="dot" r="5" fill="#d5b13a"><animateMotion dur="5s" begin="4s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear"><mpath href="#p4" /></animateMotion></circle>

    <rect x="28" y="133" width="124" height="56" rx="12" fill="#121a24" stroke="#8ea9c4" stroke-opacity="0.5" stroke-width="1.5" />
    <text class="sans" x="90" y="168" font-size="20" font-weight="600" text-anchor="middle" fill="#ece7de">Task</text>

    <rect x="186" y="127" width="138" height="68" rx="12" fill="#121a24" stroke="#8ea9c4" stroke-opacity="0.5" stroke-width="1.5" />
    <text class="sans" x="255" y="158" font-size="20" font-weight="600" text-anchor="middle" fill="#ece7de">Triage</text>
    <text class="mono" x="255" y="180" font-size="13" text-anchor="middle" fill="#8ea9c4">size + risk</text>

    <g class="chip" style="animation-delay: 0s">
      <rect x="388" y="30" width="150" height="38" rx="19" fill="#121a24" stroke="#d5b13a" stroke-opacity="0.3" stroke-width="1.5" />
      <text class="sans" x="463" y="55" font-size="17" text-anchor="middle" fill="#ece7de">Frontend</text>
    </g>
    <g class="chip" style="animation-delay: 1s">
      <rect x="388" y="86" width="150" height="38" rx="19" fill="#121a24" stroke="#d5b13a" stroke-opacity="0.3" stroke-width="1.5" />
      <text class="sans" x="463" y="111" font-size="17" text-anchor="middle" fill="#ece7de">Backend</text>
    </g>
    <g class="chip" style="animation-delay: 2s">
      <rect x="388" y="142" width="150" height="38" rx="19" fill="#121a24" stroke="#d5b13a" stroke-opacity="0.3" stroke-width="1.5" />
      <text class="sans" x="463" y="167" font-size="17" text-anchor="middle" fill="#ece7de">QA</text>
    </g>
    <g class="chip" style="animation-delay: 3s">
      <rect x="388" y="198" width="150" height="38" rx="19" fill="#121a24" stroke="#d5b13a" stroke-opacity="0.3" stroke-width="1.5" />
      <text class="sans" x="463" y="223" font-size="17" text-anchor="middle" fill="#ece7de">Security</text>
    </g>
    <g class="chip" style="animation-delay: 4s">
      <rect x="388" y="254" width="150" height="38" rx="19" fill="#121a24" stroke="#d5b13a" stroke-opacity="0.3" stroke-width="1.5" />
      <text class="sans" x="463" y="279" font-size="17" text-anchor="middle" fill="#ece7de">DevOps</text>
    </g>
    <text class="mono" x="463" y="316" font-size="14" text-anchor="middle" fill="#8ea9c4">+ 8 more agents</text>

    <rect class="gate" x="602" y="99" width="176" height="124" rx="12" fill="#121a24" stroke="#d5b13a" stroke-opacity="0.35" stroke-width="1.5" />
    <text class="sans" x="690" y="131" font-size="19" font-weight="600" text-anchor="middle" fill="#ece7de">Quality gates</text>
    <g class="mono" font-size="14" text-anchor="middle" fill="#8ea9c4">
      <text x="690" y="157">format · lint</text>
      <text x="690" y="179">typecheck · tests</text>
      <text x="690" y="201">build · smoke</text>
    </g>

    <g class="check">
      <circle cx="806" cy="161" r="17" fill="#d5b13a" />
      <path d="M798 162 l5.5 5.5 l10 -11.5" fill="none" stroke="#0c1117" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>
  <rect x="0.75" y="0.75" width="838.5" height="328.5" rx="15.25" fill="none" stroke="#8ea9c4" stroke-opacity="0.25" stroke-width="1.5" />
</svg>
