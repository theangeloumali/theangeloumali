<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 460" width="420" height="460" role="img" aria-labelledby="t d">
  <title id="t">Career timeline, 2017 to now</title>
  <desc id="d">ZKidz Dev LLC: Lead Software Engineer and AI Engineer from 2025 to now, Lead Software Engineer 2020 to 2025. Blackpepper, Senior Software Engineer, 2022 to 2024. Adaca, Senior Software Engineer, 2020 to 2022. Trends and Technologies, Full Stack Developer, 2017 to 2020.</desc>
  <defs><clipPath id="card"><rect width="420" height="460" rx="16" /></clipPath></defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .row { opacity: 0; animation: rise 0.7s cubic-bezier(0.2, 0.7, 0.2, 1) forwards; }
    .ping { transform-box: fill-box; transform-origin: center; animation: ping 2s ease-out infinite; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes ping { 0% { transform: scale(1); opacity: 0.8; } 100% { transform: scale(3); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .row { opacity: 1; } }
  </style>
  <g clip-path="url(#card)">
    <rect width="420" height="460" fill="#0c1117" />
    <line x1="34" y1="48" x2="34" y2="388" stroke="#8ea9c4" stroke-opacity="0.35" stroke-width="2" />
    <g class="row" style="animation-delay: 0.00s"><circle class="ping" cx="34" cy="48" r="6" fill="#d5b13a" /><circle cx="34" cy="48" r="6" fill="#d5b13a" />
      <text class="mono" x="58" y="53" font-size="15" fill="#d5b13a">2025 – now</text>
      <text class="sans" x="58" y="78" font-size="19" font-weight="600" fill="#ece7de">Lead Software Engineer &amp; AI Engineer</text>
      <text class="sans" x="58" y="102" font-size="16" fill="#8ea9c4">ZKidz Dev LLC</text></g>
    <g class="row" style="animation-delay: 0.15s"><circle cx="34" cy="132" r="5" fill="#0c1117" stroke="#8ea9c4" stroke-width="2" />
      <text class="mono" x="58" y="137" font-size="15" fill="#8ea9c4">2020 – 2025</text>
      <text class="sans" x="58" y="162" font-size="19" font-weight="600" fill="#ece7de">Lead Software Engineer</text>
      <text class="sans" x="58" y="186" font-size="16" fill="#8ea9c4">ZKidz Dev LLC · alongside the roles below</text></g>
    <g class="row" style="animation-delay: 0.30s"><circle cx="34" cy="216" r="5" fill="#0c1117" stroke="#8ea9c4" stroke-width="2" />
      <text class="mono" x="58" y="221" font-size="15" fill="#8ea9c4">2022 – 2024</text>
      <text class="sans" x="58" y="246" font-size="19" font-weight="600" fill="#ece7de">Senior Software Engineer</text>
      <text class="sans" x="58" y="270" font-size="16" fill="#8ea9c4">Blackpepper · Auckland</text></g>
    <g class="row" style="animation-delay: 0.45s"><circle cx="34" cy="300" r="5" fill="#0c1117" stroke="#8ea9c4" stroke-width="2" />
      <text class="mono" x="58" y="305" font-size="15" fill="#8ea9c4">2020 – 2022</text>
      <text class="sans" x="58" y="330" font-size="19" font-weight="600" fill="#ece7de">Senior Software Engineer</text>
      <text class="sans" x="58" y="354" font-size="16" fill="#8ea9c4">Adaca · Sydney</text></g>
    <g class="row" style="animation-delay: 0.60s"><circle cx="34" cy="384" r="5" fill="#0c1117" stroke="#8ea9c4" stroke-width="2" />
      <text class="mono" x="58" y="389" font-size="15" fill="#8ea9c4">2017 – 2020</text>
      <text class="sans" x="58" y="414" font-size="19" font-weight="600" fill="#ece7de">Full Stack Developer</text>
      <text class="sans" x="58" y="438" font-size="16" fill="#8ea9c4">Trends &amp; Technologies · Makati</text></g>

  </g>
  <rect x="0.75" y="0.75" width="418.5" height="458.5" rx="15.25" fill="none" stroke="#8ea9c4" stroke-opacity="0.25" stroke-width="1.5" />
</svg>
