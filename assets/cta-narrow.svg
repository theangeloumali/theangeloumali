<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 230" width="420" height="230" role="img" aria-labelledby="t d">
  <title id="t">Book a 30-minute call</title>
  <desc id="d">Tell me what you are building and what is in the way. You leave with a clear next step.</desc>
  <defs><clipPath id="card"><rect width="420" height="230" rx="16" /></clipPath></defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .arrow { animation: nudge 1.6s ease-in-out infinite; }
    @keyframes nudge { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(6px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <g clip-path="url(#card)">
    <rect width="420" height="230" fill="#0c1117" />
    <text class="sans" x="30" y="58" font-size="29" font-weight="700" letter-spacing="-0.5" fill="#ece7de">Have something to build?</text>
    <text class="sans" x="30" y="92" font-size="19" fill="#8ea9c4">30 minutes. You leave with</text>
    <text class="sans" x="30" y="117" font-size="19" fill="#8ea9c4">a clear next step.</text>
    <rect x="30" y="144" width="360" height="60" rx="30" fill="#d5b13a" />
    <text class="sans" x="196" y="182" font-size="23" font-weight="700" text-anchor="middle" fill="#0c1117">Book a call</text>
    <text class="sans arrow" x="270" y="182" font-size="23" font-weight="700" fill="#0c1117">→</text>
  </g>
  <rect x="0.75" y="0.75" width="418.5" height="228.5" rx="15.25" fill="none" stroke="#8ea9c4" stroke-opacity="0.25" stroke-width="1.5" />
</svg>
