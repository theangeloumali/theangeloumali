<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 300" width="840" height="300" role="img" aria-labelledby="t d">
  <title id="t">Christian Angelo Umali, Senior Software Engineer and AI Engineer</title>
  <desc id="d">Web platforms, mobile apps and agentic AI systems. 9+ years, six countries, 1,000+ businesses. Now building PropApp.</desc>
  <defs>
    <clipPath id="card"><rect width="840" height="300" rx="18" /></clipPath>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#8ea9c4" opacity="0.22" />
    </pattern>
    <radialGradient id="glowGold" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#d5b13a" stop-opacity="0.34" />
      <stop offset="1" stop-color="#d5b13a" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowSteel" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8ea9c4" stop-opacity="0.3" />
      <stop offset="1" stop-color="#8ea9c4" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0" stop-color="#0c1117" stop-opacity="1" />
      <stop offset="0.62" stop-color="#0c1117" stop-opacity="0.72" />
      <stop offset="1" stop-color="#0c1117" stop-opacity="0" />
    </linearGradient>
  </defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .drift { animation: drift 24s linear infinite; }
    .floatA { animation: floatA 11s ease-in-out infinite; }
    .floatB { animation: floatB 14s ease-in-out infinite; }
    .underline { stroke-dasharray: 380; stroke-dashoffset: 380; animation: draw 1.4s 0.5s cubic-bezier(0.2, 0.7, 0.2, 1) forwards; }
    .rise { opacity: 0; animation: rise 0.9s cubic-bezier(0.2, 0.7, 0.2, 1) forwards; }
    .r2 { animation-delay: 0.25s; }
    .line { opacity: 0; animation: cycle 12s infinite; }
    .l2 { animation-delay: 4s; }
    .l3 { animation-delay: 8s; }
    .spin { transform-origin: 660px 150px; animation: spin 26s linear infinite; }
    .spinRev { transform-origin: 660px 150px; animation: spin 18s linear infinite reverse; }
    .spinFast { transform-origin: 660px 150px; animation: spin 11s linear infinite; }
    .core { transform-origin: 660px 150px; animation: pulse 3.2s ease-in-out infinite; }
    @keyframes drift { to { transform: translate(-28px, -28px); } }
    @keyframes floatA { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(-26px, 18px); } }
    @keyframes floatB { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(30px, -16px); } }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes cycle { 0% { opacity: 0; transform: translateY(8px); } 4%, 30% { opacity: 1; transform: translateY(0); } 34%, 100% { opacity: 0; transform: translateY(-8px); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.12); } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .rise, .l1 { opacity: 1; }
      .underline { stroke-dashoffset: 0; }
    }
  </style>

  <g clip-path="url(#card)">
    <rect width="840" height="300" fill="#0c1117" />
    <g class="drift"><rect x="-28" y="-28" width="900" height="360" fill="url(#dots)" /></g>
    <circle class="floatA" cx="690" cy="110" r="230" fill="url(#glowGold)" />
    <circle class="floatB" cx="520" cy="290" r="200" fill="url(#glowSteel)" />
    <rect width="620" height="300" fill="url(#fade)" />

    <!-- Orbit: one core, three rings of agents -->
    <g fill="none" stroke="#8ea9c4" stroke-opacity="0.28" stroke-width="1.2">
      <circle cx="660" cy="150" r="52" />
      <circle cx="660" cy="150" r="86" stroke-dasharray="3 7" />
      <circle cx="660" cy="150" r="120" />
    </g>
    <g class="spinFast">
      <circle cx="712" cy="150" r="5" fill="#ece7de" />
      <circle cx="608" cy="150" r="3.5" fill="#8ea9c4" />
    </g>
    <g class="spinRev">
      <circle cx="660" cy="64" r="6" fill="#d5b13a" />
      <circle cx="734.5" cy="193" r="4" fill="#8ea9c4" />
      <circle cx="585.5" cy="193" r="4" fill="#ece7de" />
    </g>
    <g class="spin">
      <circle cx="780" cy="150" r="5" fill="#8ea9c4" />
      <circle cx="600" cy="46" r="4" fill="#d5b13a" />
      <circle cx="600" cy="254" r="6" fill="#ece7de" />
      <circle cx="720" cy="254" r="3.5" fill="#d5b13a" />
    </g>
    <g class="core">
      <circle cx="660" cy="150" r="22" fill="#d5b13a" fill-opacity="0.16" />
      <circle cx="660" cy="150" r="11" fill="#d5b13a" />
    </g>

    <!-- Copy -->
    <text class="mono rise" x="56" y="92" font-size="17" letter-spacing="2" fill="#8ea9c4">SENIOR SOFTWARE ENGINEER &amp; AI ENGINEER</text>
    <text class="sans rise r2" x="54" y="158" font-size="47" font-weight="700" letter-spacing="-1.2" fill="#ece7de">Christian Angelo Umali</text>
    <path class="underline" d="M56 182 H436" stroke="#d5b13a" stroke-width="4" stroke-linecap="round" fill="none" />
    <g class="sans" font-size="25" fill="#ece7de">
      <text class="line l1" x="56" y="236">Web platforms · Mobile apps · Agentic AI systems</text>
      <text class="line l2" x="56" y="236">9+ years · 6 countries · 1,000+ businesses</text>
      <text class="line l3" x="56" y="236">Now building <tspan fill="#d5b13a" font-weight="600">PropApp</tspan></text>
    </g>
  </g>
  <rect x="0.75" y="0.75" width="838.5" height="298.5" rx="17.25" fill="none" stroke="#8ea9c4" stroke-opacity="0.25" stroke-width="1.5" />
</svg>
