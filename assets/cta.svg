<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 150" width="840" height="150" role="img" aria-labelledby="t d">
  <title id="t">Book a 30-minute call</title>
  <desc id="d">Tell me what you are building and what is in the way. You leave with a clear next step, whether or not we work together.</desc>
  <defs>
    <clipPath id="card"><rect width="840" height="150" rx="16" /></clipPath>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#d5b13a" stop-opacity="0.3" />
      <stop offset="1" stop-color="#d5b13a" stop-opacity="0" />
    </radialGradient>
  </defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .glow { transform-box: fill-box; transform-origin: center; animation: breathe 4s ease-in-out infinite; }
    .arrow { animation: nudge 1.6s ease-in-out infinite; }
    @keyframes breathe { 0%, 100% { transform: scale(0.9); opacity: 0.7; } 50% { transform: scale(1.15); opacity: 1; } }
    @keyframes nudge { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(6px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <g clip-path="url(#card)">
    <rect width="840" height="150" fill="#0c1117" />
    <circle class="glow" cx="676" cy="75" r="150" fill="url(#glow)" />
    <text class="sans" x="44" y="68" font-size="32" font-weight="700" letter-spacing="-0.5" fill="#ece7de">Have something to build?</text>
    <text class="sans" x="44" y="104" font-size="20" fill="#8ea9c4">30 minutes. You leave with a clear next step.</text>
    <rect x="556" y="45" width="240" height="60" rx="30" fill="#d5b13a" />
    <text class="sans" x="660" y="83" font-size="23" font-weight="700" text-anchor="middle" fill="#0c1117">Book a call</text>
    <text class="sans arrow" x="742" y="83" font-size="23" font-weight="700" fill="#0c1117">→</text>
  </g>
  <rect x="0.75" y="0.75" width="838.5" height="148.5" rx="15.25" fill="none" stroke="#8ea9c4" stroke-opacity="0.25" stroke-width="1.5" />
</svg>
