<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 10" width="840" height="10" role="presentation">
  <defs>
    <linearGradient id="base" x1="0" x2="1">
      <stop offset="0" stop-color="#8ea9c4" stop-opacity="0" />
      <stop offset="0.5" stop-color="#8ea9c4" stop-opacity="0.45" />
      <stop offset="1" stop-color="#8ea9c4" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="spark" x1="0" x2="1">
      <stop offset="0" stop-color="#d5b13a" stop-opacity="0" />
      <stop offset="0.5" stop-color="#d5b13a" stop-opacity="1" />
      <stop offset="1" stop-color="#d5b13a" stop-opacity="0" />
    </linearGradient>
  </defs>
  <style>
    .spark { animation: run 7s ease-in-out infinite; }
    @keyframes run { 0% { transform: translateX(-160px); } 70%, 100% { transform: translateX(860px); } }
    @media (prefers-reduced-motion: reduce) { .spark { animation: none; transform: translateX(350px); } }
  </style>
  <rect x="0" y="4" width="840" height="2" fill="url(#base)" />
  <rect class="spark" x="0" y="3.5" width="140" height="3" rx="1.5" fill="url(#spark)" />
</svg>
